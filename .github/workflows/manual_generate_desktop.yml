name: Manual Generate Desktop Builds
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev libsdl2-dev libglew-dev \
              libzip-dev libpng-dev libzstd-dev libgl1-mesa-dev libssl-dev pkg-config wget

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF
          cmake --build build -j$(nproc)

      - name: Package (tar.gz - AppImage tool infra unreliable on runners)
        run: |
          mkdir -p dist/PPSSPP-linux/assets
          cp -p build/PPSSPP dist/PPSSPP-linux/
          cp -r assets/* dist/PPSSPP-linux/assets/
          cd dist && tar -czf PPSSPP-linux.tar.gz PPSSPP-linux

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-linux (tar.gz)
          path: dist/PPSSPP-linux.tar.gz

  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: brew install cmake ninja sdl2 glew zlib libzip libpng zstd pkg-config

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Bundle .app & make .dmg
        run: |
          mkdir -p dist/PPSSPP.app/Contents/MacOS dist/PPSSPP.app/Contents/Resources
          cp build/PPSSPP dist/PPSSPP.app/Contents/MacOS/PPSSPP
          cp macOS/Info.plist dist/PPSSPP.app/Contents/Info.plist
          cp -r assets dist/PPSSPP.app/Contents/Resources/
          chmod +x SDL/macbundle.sh
          ./SDL/macbundle.sh "$PWD/dist/PPSSPP.app" PPSSPP || true
          hdiutil create -volname "PPSSPP" -srcfolder dist/PPSSPP.app -ov -format UDZO dist/PPSSPP.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-macos.dmg
          path: dist/PPSSPP.dmg

  windows:
    name: Windows x64 (official zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Create git-version.cpp
        shell: bash
        run: |
          echo 'const char *PPSSPP_GIT_VERSION = "v1.20.4-mh";' > git-version.cpp
          echo '#define PPSSPP_GIT_VERSION_NO_UPDATE 1' >> git-version.cpp
          echo '#define PPSSPP_WIN_VERSION_STRING "v1.20.4-mh"' > Windows/win-version.h
          echo '#define PPSSPP_WIN_VERSION_COMMA 1,20,4' >> Windows/win-version.h
          echo '#define PPSSPP_WIN_VERSION_NO_UPDATE 1' >> Windows/win-version.h

      - name: Build (official solution)
        run: msbuild /m /p:TrackFileAccess=false /p:Configuration=Release /p:Platform=x64 Windows/PPSSPP.sln

      - name: Package (official zip)
        shell: bash
        run: |
          mkdir -p ppsspp
          cp PPSSPP*.exe ppsspp/ 2>/dev/null || true
          cp Windows/x64/Release/*.dll ppsspp/ 2>/dev/null || true
          cp -r assets ppsspp/assets
          powershell -Command "Compress-Archive -Path 'ppsspp/*' -DestinationPath 'PPSSPP-Windows-x64.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-Windows-x64 (zip)
          path: PPSSPP-Windows-x64.zip

