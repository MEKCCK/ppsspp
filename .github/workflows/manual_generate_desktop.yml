name: Manual Generate Desktop Builds
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev libsdl2-dev libglew-dev \
              libzip-dev libpng-dev libzstd-dev libgl1-mesa-dev libssl-dev pkg-config

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF
          cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/PPSSPP-linux
          cp -p build/PPSSPP dist/PPSSPP-linux/ 2>/dev/null || cp -p build/bin/PPSSPP dist/PPSSPP-linux/
          cp -r assets dist/PPSSPP-linux/ 2>/dev/null || true
          ldd dist/PPSSPP-linux/PPSSPP | grep -oE '/[^ ]+\.so[^ ]*' | while read f; do
            [ -f "$f" ] && cp -Ln --parents "$f" dist/PPSSPP-linux/
          done
          tar -C dist -czf dist/PPSSPP-linux.tar.gz PPSSPP-linux

      - uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-linux
          path: dist/PPSSPP-linux.tar.gz

  macos:
    name: macOS (zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: brew install cmake ninja sdl2 glew zlib libzip libpng zstd pkg-config

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist/PPSSPP-macos
          find build -maxdepth 3 -name 'PPSSPP*' -type f -perm -u+x | head -1
          cp -p build/PPSSPP dist/PPSSPP-macos/ 2>/dev/null || true
          cd dist && zip -r PPSSPP-macos.zip PPSSPP-macos >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-macos
          path: dist/PPSSPP-macos.zip
  windows:
    name: Windows x64 (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps (vcpkg)
        shell: bash
        run: |
          vcpkg install sdl2 glew zlib libpng libzip zstd --triplet x64-windows
          echo "VCPKG_ROOT=C:\\vcpkg" >> $GITHUB_ENV

      - name: Configure & build
        shell: bash
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF \
                -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release -j%NUMBER_OF_PROCESSORS%

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/PPSSPP-win64
          find build -iname "PPSSPP*.exe" -exec cp {} dist/PPSSPP-win64/ \;
          cp -r C:/vcpkg/installed/x64-windows/bin/*.dll dist/PPSSPP-win64/ 2>/dev/null || true
          cd dist && powershell -Command "Compress-Archive -Path PPSSPP-win64 -DestinationPath PPSSPP-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-windows-x64
          path: dist/PPSSPP-win64.zip

