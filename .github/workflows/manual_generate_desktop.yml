name: Manual Generate Desktop Builds
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev libsdl2-dev libglew-dev \
              libzip-dev libpng-dev libzstd-dev libgl1-mesa-dev libssl-dev pkg-config wget

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF
          cmake --build build -j$(nproc)

      - name: Make AppImage (official script)
        run: |
          cp -r assets build/assets
          chmod +x scripts/makeappimage_64-bit.sh
          VERSION=v1.20.4-mh ./scripts/makeappimage_64-bit.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-linux.AppImage
          path: build/*.AppImage

  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: brew install cmake ninja sdl2 glew zlib libzip libpng zstd pkg-config

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Bundle .app & make .dmg
        run: |
          mkdir -p dist/PPSSPP.app/Contents/MacOS dist/PPSSPP.app/Contents/Resources
          cp build/PPSSPP dist/PPSSPP.app/Contents/MacOS/PPSSPP
          cp macOS/Info.plist dist/PPSSPP.app/Contents/Info.plist
          cp -r assets dist/PPSSPP.app/Contents/Resources/
          chmod +x SDL/macbundle.sh
          ./SDL/macbundle.sh "$PWD/dist/PPSSPP.app" PPSSPP || true
          hdiutil create -volname "PPSSPP" -srcfolder dist/PPSSPP.app -ov -format UDZO dist/PPSSPP.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-macos.dmg
          path: dist/PPSSPP.dmg

  windows:
    name: Windows x64 (exe installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps (vcpkg + NSIS)
        shell: bash
        run: |
          vcpkg install sdl2 glew zlib libpng libzip zstd --triplet x64-windows
          choco install nsis -y

      - name: Configure & build
        shell: bash
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF \
                -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release -j%NUMBER_OF_PROCESSORS%

      - name: Stage & make installer
        shell: bash
        run: |
          mkdir -p dist
          find build -iname "PPSSPP.exe" -exec cp {} dist/ \;
          cp -r C:/vcpkg/installed/x64-windows/bin/*.dll dist/ 2>/dev/null || true
          cat > dist/install.nsi <<'NSI'
          !include "MUI2.nsh"
          Name "PPSSPP (MH Overlay)"
          OutFile "PPSSPP-Setup.exe"
          InstallDir "$PROGRAMFILES64\\PPSSPP"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "SimpChinese"
          !insertmacro MUI_LANGUAGE "English"
          Section "Install"
            SetOutPath "$INSTDIR"
            File "PPSSPP.exe"
            File "*.dll"
            File /r "assets"
            WriteUninstaller "$INSTDIR\\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            RMDir /r "$INSTDIR"
          SectionEnd
          NSI
          cd dist && "C:/Program Files (x86)/NSIS/makensis.exe" install.nsi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-windows-setup.exe
          path: dist/PPSSPP-Setup.exe