name: Manual Generate Desktop Builds
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev libsdl2-dev libglew-dev \
              libzip-dev libpng-dev libzstd-dev libgl1-mesa-dev libssl-dev pkg-config file

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF
          cmake --build build -j$(nproc)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/ppsspp/assets \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          BIN=$(find build -maxdepth 3 -type f \( -name 'PPSSPP' -o -name 'PPSSPPQt' \) -perm -u+x | head -1)
          [ -n "$BIN" ] || BIN=$(find build -maxdepth 3 -type f -name 'PPSSPP*' -perm -u+x | head -1)
          echo "BIN=$BIN"
          cp "$BIN" AppDir/usr/bin/PPSSPP
          cp -r assets/* AppDir/usr/share/ppsspp/assets/
          cp icons/hicolor/256x256/apps/ppsspp.png AppDir/usr/share/icons/hicolor/256x256/apps/ 2>/dev/null || true
          cat > AppDir/usr/share/applications/ppsspp.desktop <<'DESK'
            [Desktop Entry]
            Name=PPSSPP (MH Overlay)
            Exec=PPSSPP
            Icon=ppsspp
            Type=Application
            Categories=Game;Emulator;
          DESK
          cat > AppDir/AppRun <<'RUN'
            #!/bin/sh
            SELF=$(readlink -f "$0")
            APPDIR=${SELF%/*}
            cd "${APPDIR}/usr/share/ppsspp"
            exec "${APPDIR}/usr/bin/PPSSPP" "$@"
          RUN
          chmod +x AppDir/AppRun AppDir/usr/bin/PPSSPP

      - name: Bundle with linuxdeploy (GitHub releases)
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage
          export LDP_QT_STRIP=0
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir --executable AppDir/usr/bin/PPSSPP \
            --desktop-file AppDir/usr/share/applications/ppsspp.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/ppsspp.png \
            --plugin qt
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir PPSSPP-x86_64.AppImage

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-linux.AppImage
          path: PPSSPP-x86_64.AppImage
  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: brew install cmake ninja sdl2 glew zlib libzip libpng zstd pkg-config

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FFMPEG=OFF \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Bundle .app & make .dmg
        run: |
          echo "--- build listing ---"; find build -maxdepth 3 | head -40
          APP=$(find build -maxdepth 3 -type d -name 'PPSSPP.app' | head -1)
          if [ -z "$APP" ]; then
            BIN=$(find build -maxdepth 3 -type f -perm -u+x -name 'PPSSPP*' | head -1)
            echo "BIN=$BIN"
            [ -n "$BIN" ] || { echo "no binary found"; exit 1; }
            APP=dist/PPSSPP.app
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "$BIN" "$APP/Contents/MacOS/PPSSPP"
            cp macOS/Info.plist "$APP/Contents/Info.plist"
          fi
          echo "APP=$APP"
          mkdir -p "$APP/Contents/Resources"
          cp -r assets "$APP/Contents/Resources/assets"
          chmod +x "$APP/Contents/MacOS/PPSSPP" 2>/dev/null || true
          if [ -d SDL/macOS/SDL2.framework ]; then
            chmod +x SDL/macbundle.sh
            ./SDL/macbundle.sh "$PWD/$APP" PPSSPP || true
          fi
          mkdir -p dist
          hdiutil create -volname "PPSSPP" -srcfolder "$APP" -ov -format UDZO dist/PPSSPP.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-macos.dmg
          path: dist/PPSSPP.dmg

  windows:
    name: Windows x64 (official zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Create git-version.cpp
        shell: bash
        run: |
          echo 'const char *PPSSPP_GIT_VERSION = "v1.20.4-mh";' > git-version.cpp
          echo '#define PPSSPP_GIT_VERSION_NO_UPDATE 1' >> git-version.cpp
          echo '#define PPSSPP_WIN_VERSION_STRING "v1.20.4-mh"' > Windows/win-version.h
          echo '#define PPSSPP_WIN_VERSION_COMMA 1,20,4' >> Windows/win-version.h
          echo '#define PPSSPP_WIN_VERSION_NO_UPDATE 1' >> Windows/win-version.h

      - name: Build (official solution)
        run: msbuild /m /p:TrackFileAccess=false /p:Configuration=Release /p:Platform=x64 Windows/PPSSPP.sln

      - name: Package (official zip)
        shell: bash
        run: |
          mkdir -p ppsspp
          cp PPSSPP*.exe ppsspp/ 2>/dev/null || true
          cp Windows/x64/Release/*.dll ppsspp/ 2>/dev/null || true
          cp -r assets ppsspp/assets
          powershell -Command "Compress-Archive -Path 'ppsspp/*' -DestinationPath 'PPSSPP-Windows-x64.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-Windows-x64 (zip)
          path: PPSSPP-Windows-x64.zip

